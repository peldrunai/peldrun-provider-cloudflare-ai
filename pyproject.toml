# pyproject.toml
# Build metadata and tooling configuration for the Cloudflare Workers AI
# PELDRUN provider package.
#
# Two roles:
#   1. Enables `pip install -e .` for local development / testing.
#   2. Provides configuration for pytest, ruff, and mypy in CI.
#
# The actual runtime dependency list lives in `requirements.txt`, NOT
# here. This keeps a single source of truth that both the isolated
# venv builder (DependencyInstaller) and `pip install -r` consume.
# The `dependencies` array below mirrors requirements.txt verbatim and
# is regenerated by hand when the file changes — see CONTRIBUTING.md.
#
# Version field MUST match manifest.json["version"]. Run
# `python scripts/update_version.py --check` to verify consistency.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "cloudflare-ai-peldrun"
# IMPORTANT: keep in sync with manifest.json["version"].
# scripts/update_version.py rewrites both files together.
version = "1.0.4"
description = "Cloudflare Workers AI provider adapter for PELDRUN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "PELDRUN Community", email = "noreply@peldrun.dev" },
]
keywords = [
    "peldrun",
    "llm",
    "provider",
    "cloudflare",
    "workers-ai",
    "serverless",
    "llama",
    "mistral",
    "qwen",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Runtime dependencies. Kept in lockstep with requirements.txt — the
# upper bounds are deliberate (PELDRUN's own pins), so do NOT relax
# them without aligning both files.
dependencies = [
    "openai>=2.50.0,<3.0.0",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
# Development extras, used by contributors and CI only. Never installed
# inside PELDRUN's isolated provider venv.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
    "mypy>=1.10,<2.0",
]

[project.urls]
Homepage = "https://developers.cloudflare.com/workers-ai/"
Repository = "https://github.com/peldrun/peldrun-providers"
Issues = "https://github.com/peldrun/peldrun-providers/issues"
Documentation = "https://developers.cloudflare.com/workers-ai/get-started/rest-api/"

# ---------------------------------------------------------------------------
# setuptools: package discovery
# ---------------------------------------------------------------------------

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloudflare_ai_peldrun*"]
exclude = ["tests*", "scripts*", "dist*"]

[tool.setuptools.package-data]
cloudflare_ai_peldrun = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
# -ra: show extra summary lines for all tests (skips, xfails, etc.)
# --showlocals: include local variables in tracebacks on failure
testpaths = ["tests"]
# Note: this package has no async tests. The `pytest-asyncio`
# plugin is listed under [project.optional-dependencies].dev for
# contributors who want to add live async tests locally, but CI
# installs pytest alone — so `asyncio_mode` is deliberately NOT
# set here (it would be an unknown option for a bare pytest run).
# Filter warnings that are known-but-out-of-scope for this package.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:openai.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::PendingDeprecationWarning:.*",
]
# Show locals in tracebacks for easier debugging of failures.
addopts = "-ra --strict-markers --strict-config --showlocals"

markers = [
    "live: marks tests that hit the real Cloudflare API (require credentials)",
    "slow: marks tests that take more than 1 second",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/cloudflare_ai_peldrun"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Fail CI if coverage drops below this threshold.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# ruff (linting + import sorting)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
# Never lint build artifacts.
extend-exclude = [
    "dist",
    "build",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort, N: pep8-naming,
# UP: pyupgrade, B: bugbear, C4: comprehensions, SIM: simplify,
# RUF: ruff-specific.
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    # E501 is superseded by ruff's line-length handling.
    "E501",
    # B008: function call in default arg (we don't use it, but the
    # rule is noisy and not worth the friction).
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use assert statements, and are allowed to be
# slightly less disciplined about import order.
"tests/**/*.py" = ["S101", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["cloudflare_ai_peldrun"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy (static type checking)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src/cloudflare_ai_peldrun"]
# Strict-ish, but not maximal — the goal is to catch real errors, not
# to fight the type checker on every line.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = false
# The peldrun package is NOT installed during type-checking (it lives
# inside the plugin host venv at runtime). All imports from it are
# treated as Any.
ignore_missing_imports = true
# The module is fully typed where it matters; the escape hatches for
# peldrun imports are unavoidable at this layer.
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "peldrun.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true