# .github/workflows/release.yml
# Runs on every `v*` tag push. Produces:
#   * dist/cloudflare-ai-<version>.zip       (the archive)
#   * dist/catalog-entry.json                 (catalog metadata)
#   * a GitHub Release containing both files
#
# The release tag MUST match manifest.json["version"] (without the
# leading "v"). A mismatch aborts the workflow BEFORE any release is
# created — this prevents the common footgun where the tag and the
# manifest drift apart.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true
        type: string

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8.0,<9.0"

      - name: Validate manifest
        run: python scripts/validate_manifest.py

      - name: Verify version consistency
        run: python scripts/update_version.py --check

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          TAG_VERSION="${TAG#v}"
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Tag version:      $TAG_VERSION"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match manifest.json version ($MANIFEST_VERSION)."
            echo "Run 'python scripts/update_version.py $TAG_VERSION' locally and commit before tagging."
            exit 1
          fi

      - name: Build the distributable ZIP
        run: python scripts/build_package.py --verify

      - name: Verify the produced ZIP
        id: verify
        run: |
          python scripts/verify_package.py > verify.log 2>&1
          cat verify.log
          SHA=$(grep -oE '^  sha256: +[0-9a-f]{64}' verify.log | awk '{print $2}')
          if [ -z "$SHA" ]; then
            echo "::error::Could not extract SHA-256 from verify output."
            exit 1
          fi
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Extracted SHA-256: $SHA"

      - name: Generate catalog entry
        env:
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/cloudflare-ai-${{ steps.tag.outputs.tag }}.zip"
          # The download URL above uses the tag with the 'v' prefix.
          # generate_catalog_entry.py reads the version from
          # manifest.json and uses it for the ZIP filename inside the
          # URL — the tag prefix appears only in the URL path segment
          # (releases/download/<tag>/...), which GitHub serves as-is.
        run: |
          # Compute the effective URL with the correct ZIP filename.
          VERSION=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/cloudflare-ai-${VERSION}.zip"
          echo "Download URL: $URL"
          python scripts/generate_catalog_entry.py \
            --download-url "$URL" \
            --brand-color "#F38020" \
            --icon cloudflare \
            --repository-url "https://github.com/${{ github.repository }}" \
            --docs-url "https://developers.cloudflare.com/workers-ai/"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: |
            dist/*.zip
            dist/catalog-entry.json
            verify.log
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/catalog-entry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}