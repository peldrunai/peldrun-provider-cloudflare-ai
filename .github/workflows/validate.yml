# .github/workflows/validate.yml
# Runs on every push to main and every pull request.
#
# Goal: catch a broken manifest, an unbuildable archive, or a stale
# test file BEFORE it reaches main. Not intended to test the adapter
# itself (the adapter requires peldrun, which is not installed here).
#
# Uses only the project's own dependencies + pytest. Nothing else.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch tags so `git describe` works inside scripts if needed.
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0,<9.0"

      - name: Validate manifest.json
        run: python scripts/validate_manifest.py

      - name: Check version consistency across files
        run: python scripts/update_version.py --check

      - name: Build the distributable ZIP
        run: python scripts/build_package.py --verify

      - name: Verify the produced ZIP
        run: python scripts/verify_package.py

      - name: Run tests
        run: python -m pytest tests -v

      - name: Upload the built ZIP as a workflow artifact
        # Useful for PRs: reviewers can download the ZIP and install it.
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-ai-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14